name: Scrape UBC course data

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run scrape:all
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
